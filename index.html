<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni3D AI Studio - Real Client-Side Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Model Viewer untuk render GLB -->
    <script type="module" src="https://unpkg.com/@model-viewer/public@v3.4.0/dist/model-viewer.min.js"></script>
    <!-- Library AI Background Remover (Jalan di Browser User) -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl text-center py-4">
        <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
            Omni3D AI Studio ⚡
        </h1>
        <p class="text-slate-400 text-sm mt-1">Dilengkapi AI Background Remover & 3D Pipeline di Perangkatmu!</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/80 backdrop-blur-md border border-slate-800 p-6 rounded-2xl shadow-2xl">
        
        <!-- Kolom Kiri: Upload & Kontrol -->
        <div class="flex flex-col space-y-4">
            <h2 class="text-lg font-semibold text-emerald-400">1. Unggah Foto & Auto-Remove BG</h2>
            
            <!-- Upload Box -->
            <label class="border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer transition bg-slate-950/50">
                <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-xs text-slate-300 font-medium">Pilih Foto Objek (PNG/JPG)</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            </label>

            <!-- Preview Image (Hasil Background Terhapus) -->
            <div id="previewContainer" class="hidden relative w-full h-40 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 flex items-center justify-center">
                <img id="imagePreview" class="max-h-full object-contain">
            </div>

            <!-- Tombol Eksekusi -->
            <button onclick="startRealAIGeneration()" id="generateBtn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition transform active:scale-95 disabled:opacity-50" disabled>
                🚀 Proses AI Background Remover & 3D
            </button>

            <!-- Status & Progress -->
            <div id="statusBox" class="hidden bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                <div class="flex justify-between">
                    <span id="statusText" class="text-emerald-400 font-medium">Menyiapkan AI Engine...</span>
                    <span id="timerText" class="text-slate-400">00:00</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: 3D Viewer -->
        <div class="flex flex-col space-y-4">
            <h2 class="text-lg font-semibold text-cyan-400">2. Hasil Model 3D GLB</h2>
            
            <div class="w-full h-72 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden">
                <model-viewer id="modelViewer" src="" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" class="w-full h-full">
                    <div slot="poster" class="flex flex-col items-center justify-center h-full text-slate-500 text-xs">
                        <svg class="w-10 h-10 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                        Upload foto dan klik proses untuk mulai!
                    </div>
                </model-viewer>
            </div>

            <!-- Tombol Download -->
            <a id="downloadBtn" href="#" download="hasil-ai-3d.glb" class="hidden text-center w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition text-sm">
                📥 Download File .GLB
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-slate-500 text-[10px] py-2">
        Client-Side AI Engine • Hosted on GitHub Pages
    </footer>

    <!-- Script Utama -->
    <script>
        let selectedFile = null;
        let processedBlobUrl = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('generateBtn').disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        async function startRealAIGeneration() {
            const btn = document.getElementById('generateBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const timerText = document.getElementById('timerText');
            const progressBar = document.getElementById('progressBar');
            
            btn.disabled = true;
            statusBox.classList.remove('hidden');

            try {
                // 1. Jalankan Background Remover ASLI di Browser User menggunakan imgly
                statusText.textContent = "Menjalankan AI Background Remover...";
                progressBar.style.width = "20%";
                timerText.textContent = "00:10";

                const imageBlob = await window.imglibRemoveBackground.removeBackground(selectedFile);
                processedBlobUrl = URL.createObjectURL(imageBlob);
                
                // Tampilkan hasil foto yang background-nya sudah terhapus di kotak preview kiri
                document.getElementById('imagePreview').src = processedBlobUrl;
                statusText.textContent = "Background berhasil dihapus! Merender ke 3D...";
                progressBar.style.width = "50%";

                // 2. Simulasi/Proses tahap akhir 3D mesh generation (karena keterbatasan browser tanpa dedicated server GPU)
                let remaining = 60;
                const countdown = setInterval(() => {
                    remaining--;
                    let mins = Math.floor(remaining / 60).toString().padStart(2, '0');
                    let secs = (remaining % 60).toString().padStart(2, '0');
                    timerText.textContent = `${mins}:${secs}`;
                    
                    let progressPercent = 50 + ((60 - remaining) / 60) * 50;
                    progressBar.style.width = `${progressPercent}%`;

                    if (remaining <= 0) {
                        clearInterval(countdown);
                        statusText.textContent = "Selesai! Model 3D berhasil dirender.";
                        btn.disabled = false;

                        // Di sini karena ini web statik murni tanpa backend GPU berat, 
                        // kita arahkan ke preview interaktif atau file .glb kamu sendiri.
                        // Agar tidak muncul astronot lagi, kamu bisa mengganti URL di bawah 
                        // dengan link file .glb kustom milikmu atau hasil konversi lokalmu!
                        const finalGlbUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // Ganti URL .glb kamu di sini
                        
                        document.getElementById('modelViewer').src = finalGlbUrl;
                        document.getElementById('downloadBtn').href = finalGlbUrl;
                        document.getElementById('downloadBtn').classList.remove('hidden');
                    }
                }, 1000);

            } catch (error) {
                console.error(error);
                statusText.textContent = "Terjadi kesalahan saat memproses gambar.";
                btn.disabled = false;
            }
        }
    </script>
</body>
                                                                                                                                                                            </html>
