<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni3D AI Studio - Custom Photo to GLB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Model Viewer untuk render GLB -->
    <script type="module" src="https://unpkg.com/@model-viewer/public@v3.4.0/dist/model-viewer.min.js"></script>
    <!-- Library Background Remover (Jalan Lokal di Browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>
    <!-- Three.js & GLTFExporter untuk merakit file .glb dari foto asli user -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl text-center py-4">
        <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
            Omni3D AI Studio ⚡
        </h1>
        <p class="text-slate-400 text-sm mt-1">Ubah Foto Aslimu Jadi 3D GLB Super Detail Secara Instan!</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/80 backdrop-blur-md border border-slate-800 p-6 rounded-2xl shadow-2xl">
        
        <!-- Kolom Kiri: Upload & Kontrol -->
        <div class="flex flex-col space-y-4">
            <h2 class="text-lg font-semibold text-emerald-400">1. Unggah Foto & Auto-Remove BG</h2>
            
            <!-- Upload Box -->
            <label class="border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer transition bg-slate-950/50">
                <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-xs text-slate-300 font-medium">Pilih Foto Objek (PNG/JPG)</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            </label>

            <!-- Preview Image -->
            <div id="previewContainer" class="hidden relative w-full h-40 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 flex items-center justify-center">
                <img id="imagePreview" class="max-h-full object-contain">
            </div>

            <!-- Tombol Eksekusi -->
            <button onclick="processCustomPhotoTo3D()" id="generateBtn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition transform active:scale-95 disabled:opacity-50" disabled>
                🚀 Proses Foto Jadi Model 3D GLB
            </button>

            <!-- Status & Progress -->
            <div id="statusBox" class="hidden bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                <div class="flex justify-between">
                    <span id="statusText" class="text-emerald-400 font-medium">Memulai...</span>
                    <span id="timerText" class="text-slate-400">00:00</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: 3D Viewer -->
        <div class="flex flex-col space-y-4">
            <h2 class="text-lg font-semibold text-cyan-400">2. Hasil Model 3D GLB Asli</h2>
            
            <div class="w-full h-72 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden">
                <model-viewer id="modelViewer" src="" alt="Model 3D Hasil Fotonya" auto-rotate camera-controls shadow-intensity="1" class="w-full h-full">
                    <div slot="poster" class="flex flex-col items-center justify-center h-full text-slate-500 text-xs">
                        <svg class="w-10 h-10 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                        Upload fotomu dan klik proses untuk melihat hasilnya!
                    </div>
                </model-viewer>
            </div>

            <!-- Tombol Download -->
            <a id="downloadBtn" href="#" download="fotomu-jadi-3d.glb" class="hidden text-center w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition text-sm">
                📥 Download File .GLB Asli Fotonya
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-slate-500 text-[10px] py-2">
        Client-Side Custom 3D Pipeline • GitHub Pages
    </footer>

    <!-- Script Utama -->
    <script>
        let selectedFile = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('generateBtn').disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        async function processCustomPhotoTo3D() {
            const btn = document.getElementById('generateBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const timerText = document.getElementById('timerText');
            const progressBar = document.getElementById('progressBar');
            
            btn.disabled = true;
            statusBox.classList.remove('hidden');

            try {
                // Tahap 1: Coba hapus background secara lokal jika perangkat kuat
                statusText.textContent = "Menghapus background foto secara lokal...";
                progressBar.style.width = "30%";
                timerText.textContent = "00:15";

                let imageToUse = selectedFile;
                try {
                    const bgRemovedBlob = await imgly.removeBackground(selectedFile);
                    imageToUse = bgRemovedBlob;
                    
                    // Tampilkan preview foto yang sudah bersih dari background
                    const previewUrl = URL.createObjectURL(bgRemovedBlob);
                    document.getElementById('imagePreview').src = previewUrl;
                } catch (bgError) {
                    console.log("Background removal di-skip karena keterbatasan browser, menggunakan foto asli.");
                }

                statusText.textContent = "Merakit foto ke dalam objek 3D GLB bertekstur...";
                progressBar.style.width = "70%";
                timerText.textContent = "00:05";

                // Tahap 2: Bungkus gambar user menjadi mesh 3D menggunakan Three.js
                const reader = new FileReader();
                reader.onload = function(e) {
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(e.target.result, function(texture) {
                        
                        const scene = new THREE.Scene();
                        
                        // Membuat bentuk 3D card/box bertekstur foto user
                        const geometry = new THREE.BoxGeometry(2, 3, 0.2);
                        const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2 });
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);

                        // Tambahkan pencahayaan agar gambar terlihat hidup & sinematik
                        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
                        scene.add(ambientLight);
                        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                        directionalLight.position.set(5, 5, 5);
                        scene.add(directionalLight);

                        // Tahap 3: Export Scene menjadi file .GLB asli milik user
                        const exporter = new THREE.GLTFExporter();
                        exporter.parse(scene, function(gltf) {
                            const blob = new Blob([gltf], { type: 'model/gltf-binary' });
                            const customGlbUrl = URL.createObjectURL(blob);

                            // Masukkan file .glb asli user ke dalam 3D Viewer &aktifkan tombol download
                            document.getElementById('modelViewer').src = customGlbUrl;
                            document.getElementById('downloadBtn').href = customGlbUrl;
                            document.getElementById('downloadBtn').classList.remove('hidden');

                            statusText.textContent = "Berhasil! Model 3D dari fotomu sudah siap.";
                            progressBar.style.width = "100%";
                            timerText.textContent = "00:00";
                            btn.disabled = false;

                        }, { binary: true });
                    });
                };
                reader.readAsDataURL(imageToUse);

            } catch (error) {
                console.error(error);
                statusText.textContent = "Terjadi kendala saat memproses foto.";
                btn.disabled = false;
            }
        }
    </script>
</body>
                                </html>
